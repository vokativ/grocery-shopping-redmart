# EXPERIMENTAL example FairPrice catalog (platform: fairprice). There is no tested FairPrice
# cart procedure yet; this file only shows the catalog shape and validates.
#
# Every product is real data from the 2026-11-19 FairPrice snapshot in
# experiments/fairprice/backup-catalog.yaml, mapped to the item ids, aliases and default
# quantities of the maintainer's RedMart catalog. Items with no acceptable FairPrice
# substitute in that snapshot (e.g. sliced_cheese, apples, sausages) are left out.
# Prices are a dated reference (2026-11-19), not a buying rule.
#
# How to use it:
#   mkdir -p catalogs/fairprice && cp examples/fairprice.catalog.yaml catalogs/fairprice/<handle>.yaml
#   (or cp examples/fairprice.catalog.yaml grocery-catalog.local.yaml), then replace store_id
#   with your own FairPrice store id and edit the products. Never edit grocery-catalog.yaml.
#
# Validate:
#   node tools/validate-catalog.mjs --catalog examples/fairprice.catalog.yaml
catalog_version: 2
store:
  platform: fairprice
  name: "NTUC FairPrice online (www.fairprice.com.sg)"
  country: Singapore
  store_id: "<YOUR_STORE_ID>"
  identity: article_id
  canonical_url_pattern: "https://www.fairprice.com.sg/product/<slug>"
  notes:
    - "slug is a mutable hint: re-resolve via the product API before use."
    - "store_id placeholder means not configured: replace it with your own store id."
    - "Prices are a dated reference (snapshot date 2026-11-19), not a buying rule."
    - "Marketplace items (article ids starting 90) can push the delivery slot."
    - "Experimental: there is no tested FairPrice cart procedure."

