# Example RedMart catalog: a trimmed copy of one household's real grocery-catalog.yaml.
#
# Titles, item/SKU ids, URLs, prices and dates are real (snapshot taken from the
# maintainer's catalog, so prices are stale and ids may no longer be sold).
# It is meant to show every catalog feature on a small file: ranked backup
# products, `alias_product_ranks` (see sliced_cheese and apples), a
# `household_baskets` entry (remedy_sodaly_mix, whose members are also items),
# per-item notes, and default quantities.
#
# How to use it:
#   cp examples/redmart.catalog.yaml grocery-catalog.local.yaml
#   then edit the copy (replace the products with your own). Never edit
#   grocery-catalog.yaml: that is the maintainer's personal catalog.
#
# Validate:
#   node tools/validate-catalog.mjs --catalog examples/redmart.catalog.yaml
catalog_version: 2
store:
  platform: redmart
  name: RedMart on Lazada Singapore
  country: Singapore
  canonical_url_pattern: "https://www.lazada.sg/products/i<item_id>-s<sku_id>.html"
  notes:
    - Use canonical_url for shopping runs.
    - Ignore long tracking and search parameters such as spm, priceCompare, search, request_id, and observed referrers.
    - observed_price_sgd is the latest observed price on observed_price_date (refreshed by tools/track-prices.mjs; history in price-history.csv), not a buying rule.
    - Prefer products available for delivery today or tomorrow. Two days from now is acceptable. More than two days from now needs human review.

